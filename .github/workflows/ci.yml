name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pastagansa
          POSTGRES_USER: pastagansa_admin
          POSTGRES_PASSWORD: pastagansa_admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pastagansa_admin" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pastagansa_app:pastagansa_app@localhost:5432/pastagansa?schema=public
      DIRECT_DATABASE_URL: postgresql://pastagansa_admin:pastagansa_admin@localhost:5432/pastagansa?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      JWT_ISSUER: pastagansa
      JWT_AUDIENCE: pastagansa-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils poppler-utils
      - run: npm run db:generate
      - name: Create CI application role
        run: |
          docker run --rm --network host \
            --volume "$PWD/docker/postgres/init-app-role.sh:/init-app-role.sh:ro" \
            --env PGHOST=127.0.0.1 \
            --env PGPORT=5432 \
            --env POSTGRES_USER=pastagansa_admin \
            --env POSTGRES_DB=pastagansa \
            --env PGPASSWORD=pastagansa_admin \
            --env PASTAGANSA_APP_PASSWORD=pastagansa_app \
            postgres:17-alpine \
            sh /init-app-role.sh
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - name: Run browser acceptance with captured SMTP attachments
        env:
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: 2525
          SMTP_FROM: PastaGansa Test <test@example.test>
          E2E_SMTP_RECIPIENT: u6-acceptance@example.test
          E2E_MAILBOX_URL: http://127.0.0.1:2526/messages
        run: npm run test:e2e
      - run: npm audit --audit-level=high
      - name: Validate production deployment configuration
        run: |
          bash -n scripts/production-common.sh scripts/production-up.sh scripts/production-backup.sh scripts/production-restore-drill.sh scripts/production-first-use-check.sh
          docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet
      - name: Verify staging images and restore drill
        env:
          POSTGRES_ADMIN_PASSWORD: ci-staging-admin-password
          POSTGRES_APP_PASSWORD: ci-staging-app-password
          DATABASE_URL: postgresql://pastagansa_app:ci-staging-app-password@postgres:5432/pastagansa?schema=public
          DIRECT_DATABASE_URL: postgresql://pastagansa_admin:ci-staging-admin-password@postgres:5432/pastagansa?schema=public
          JWT_SECRET: ci-staging-secret-with-at-least-32-characters
          WEB_PORT: 3101
        run: |
          touch .env.staging
          ./scripts/staging-up.sh
          first_seed="$(./scripts/seed-demo.sh)"
          second_seed="$(./scripts/seed-demo.sh)"
          echo "$first_seed"
          echo "$second_seed"
          echo "$second_seed" | grep '"created": 0'
          echo "$second_seed" | grep '"existing": 11'
          backup_file="$(./scripts/backup-database.sh)"
          ./scripts/restore-drill.sh "$backup_file"
      - name: Stop staging stack
        if: always()
        env:
          POSTGRES_ADMIN_PASSWORD: ci-staging-admin-password
          POSTGRES_APP_PASSWORD: ci-staging-app-password
          DATABASE_URL: postgresql://pastagansa_app:ci-staging-app-password@postgres:5432/pastagansa?schema=public
          DIRECT_DATABASE_URL: postgresql://pastagansa_admin:ci-staging-admin-password@postgres:5432/pastagansa?schema=public
          JWT_SECRET: ci-staging-secret-with-at-least-32-characters
        run: docker compose --env-file .env.staging -f docker-compose.staging.yml down -v
      - name: Verify fresh production install and upgrade drill
        run: |
          cp .env.production.example .env.production
          sed -i \
            -e 's/replace-with-a-long-random-production-admin-password/ci-production-admin-password/g' \
            -e 's/replace-with-a-long-random-production-app-password/ci-production-app-password/g' \
            -e 's/replace-with-at-least-32-random-production-characters/ci-production-secret-with-at-least-32-characters/g' \
            -e 's/WEB_PORT=3101/WEB_PORT=3102/' .env.production
          chmod 600 .env.production
          ./scripts/production-up.sh init
          docker compose --env-file .env.production -f docker-compose.production.yml exec -T api sh -c 'test ! -e /app/scripts/seed-demo.mjs'
          backup_file="$(./scripts/production-backup.sh)"
          ./scripts/production-restore-drill.sh "$backup_file"
          ./scripts/production-up.sh upgrade
      - name: Stop disposable production smoke stack
        if: always()
        run: |
          if [[ -f .env.production ]]; then
            source scripts/production-common.sh
            "${production_compose[@]}" down -v
          fi
