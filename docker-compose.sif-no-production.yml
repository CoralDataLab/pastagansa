services:
  api:
    group_add:
      - ${SIF_NO_SECRET_GID:?set SIF_NO_SECRET_GID}
    environment:
      SIF_PRODUCTION_RELEASE_ENABLED: "true"
      SIF_PRODUCTION_RELEASE_COMPANY_ID: ${SIF_PRODUCTION_RELEASE_COMPANY_ID:?set SIF_PRODUCTION_RELEASE_COMPANY_ID}
      SIF_PRODUCTION_DECLARATION_PATH: /run/secrets/sif-declaration.pdf
      SIF_PRODUCTION_DECLARATION_SHA256: ${SIF_PRODUCTION_DECLARATION_SHA256:?set SIF_PRODUCTION_DECLARATION_SHA256}
      SIF_NO_SIGNING_ENABLED: "true"
      SIF_NO_COMPANY_ID: ${SIF_NO_COMPANY_ID:?set SIF_NO_COMPANY_ID}
      SIF_NO_ISSUER_TAX_ID: ${SIF_NO_ISSUER_TAX_ID:?set SIF_NO_ISSUER_TAX_ID}
      SIF_NO_CERT_SHA256: ${SIF_NO_CERT_SHA256:?set SIF_NO_CERT_SHA256}
      SIF_NO_PFX_PATH: /run/secrets/sif-no.p12
      SIF_NO_PFX_PASSPHRASE_FILE: /run/secrets/sif-no-passphrase
    volumes:
      - type: bind
        source: ${SIF_PRODUCTION_DECLARATION_HOST_PATH:?set SIF_PRODUCTION_DECLARATION_HOST_PATH}
        target: /run/secrets/sif-declaration.pdf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SIF_NO_PFX_HOST_PATH:?set SIF_NO_PFX_HOST_PATH}
        target: /run/secrets/sif-no.p12
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SIF_NO_PFX_PASSPHRASE_HOST_PATH:?set SIF_NO_PFX_PASSPHRASE_HOST_PATH}
        target: /run/secrets/sif-no-passphrase
        read_only: true
        bind:
          create_host_path: false
