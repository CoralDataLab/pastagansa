services:
  api:
    group_add:
      - ${AEAT_PRODUCTION_SECRET_GID:?set AEAT_PRODUCTION_SECRET_GID}
    environment:
      SIF_PRODUCTION_RELEASE_ENABLED: "true"
      SIF_PRODUCTION_RELEASE_COMPANY_ID: ${SIF_PRODUCTION_RELEASE_COMPANY_ID:?set SIF_PRODUCTION_RELEASE_COMPANY_ID}
      SIF_PRODUCTION_DECLARATION_PATH: /run/secrets/sif-declaration.pdf
      SIF_PRODUCTION_DECLARATION_SHA256: ${SIF_PRODUCTION_DECLARATION_SHA256:?set SIF_PRODUCTION_DECLARATION_SHA256}
      AEAT_PRODUCTION_ENABLED: "true"
      AEAT_PRODUCTION_COMPANY_ID: ${AEAT_PRODUCTION_COMPANY_ID:?set AEAT_PRODUCTION_COMPANY_ID}
      AEAT_PRODUCTION_ISSUER_TAX_ID: ${AEAT_PRODUCTION_ISSUER_TAX_ID:?set AEAT_PRODUCTION_ISSUER_TAX_ID}
      AEAT_PRODUCTION_CERT_SHA256: ${AEAT_PRODUCTION_CERT_SHA256:?set AEAT_PRODUCTION_CERT_SHA256}
      AEAT_PRODUCTION_PFX_PATH: /run/secrets/aeat-production.p12
      AEAT_PRODUCTION_PFX_PASSPHRASE_FILE: /run/secrets/aeat-production-passphrase
    volumes:
      - type: bind
        source: ${SIF_PRODUCTION_DECLARATION_HOST_PATH:?set SIF_PRODUCTION_DECLARATION_HOST_PATH}
        target: /run/secrets/sif-declaration.pdf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AEAT_PRODUCTION_PFX_HOST_PATH:?set AEAT_PRODUCTION_PFX_HOST_PATH}
        target: /run/secrets/aeat-production.p12
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AEAT_PRODUCTION_PFX_PASSPHRASE_HOST_PATH:?set AEAT_PRODUCTION_PFX_PASSPHRASE_HOST_PATH}
        target: /run/secrets/aeat-production-passphrase
        read_only: true
        bind:
          create_host_path: false
